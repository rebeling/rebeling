introduction:
  headline: Zusammenfassung
  text: |
    Ich bin ein leidenschaftlicher Softwareentwickler, der tiefes technisches Fachwissen mit einem breiten strategischen Blick verbindet. Mein Hintergrund in der Computerlinguistik ermöglicht es mir, Sprachtechnologien, maschinelles Lernen und KI in Produkte einzubinden, die Nutzer begeistern und neuen Mehrwert schaffen. Aktuell beschäftige ich mich intensiv mit Multi-Agenten-Systemen und der Frage, wie autonome Agenten kooperieren können, um komplexe Probleme zu lösen.

    Egal, ob ich großskalierte NLP-Pipelines aufbaue oder User-Flows verfeinere, ich behalte stets sowohl das technische Detail als auch das übergeordnete Geschäftsziel im Blick. Ich setze auf kontinuierliche Verbesserung: Ich vertiefe mich in komplexe Themen, teile mein Wissen und iteriere schnell durch agile Praktiken und Automatisierung. Diese Mischung aus Spezialisierung und Generalisten-Mentalität hilft mir, hochwirksame Lösungen in kurzen Zeiträumen zu liefern. Ich gehe jedes Projekt mit Neugier, Empathie und Tatendrang an, um kluge Technologieentscheidungen mit klaren Geschäftsergebnissen in Einklang zu bringen.

jobs:
  headline: Berufserfahrung
  items:
    uv:
      link: https://www.universum.com/
      name: Universum AG
      role: Senior Software Entwickler
      from: 2018
      from-month: OKT
      to: HEUTE
      summary: >-
        Leitung der Full-Stack-Entwicklung und KI-Integration für unternehmenskritische Projekte, Abstimmung der technischen Implementierung mit strategischen Geschäftszielen. Federführung bei Initiativen in den Bereichen Automatisierung, NLP und sicheres Systemdesign, Beitrag zur Produktinnovation, Nutzerbindung und betrieblichen Effizienz im gesamten Unternehmen.
      highlights:
        - Entwurf und Implementierung eines KI-gestützten Tools zur Integration von Chatbot-Funktionen mit automatisierten E-Mail-Antworten unter Nutzung der Wissensdatenbank des Unternehmens und ChatGPT (Docker, Python, FastAPI, OpenAI, Redis, JavaScript, Vue.js, GitLab CI).
        - Entwicklung von APIs für die Integration des sicheren kryptografischen Online-Wahlsystems Belenios, Unterstützung von 60.000 Nutzern und Bewältigung von ~20 Stimmen/Sekunde (600 pro 30s) (Python, FastAPI).
        - Aufbau und Pflege eines skalierbaren Content-Pools zur Aggregation von Nachrichten- und Eventdaten für die nahtlose Integration in mobile Apps (Python, Elasticsearch).
        - Entwicklung eines benutzerdefinierten Drupal-Moduls mit KI-gesteuerter, NLP-erweiterter Suchfunktionalität (PHP, Python, Watson, spaCy, Elasticsearch).
        - Optimierung der Git-Workflows und CI/CD-Pipelines im Team, was die Bereitstellungszeit erheblich verkürzte und die Effizienz der Zusammenarbeit steigerte (Git, GitLab, Make, Ansible).
        - Organisation und Hosting lokaler Drupal-Meetups zur Förderung des Community-Engagements und des Wissensaustauschs.

    rtr:
      link: https://www.retresco.com/
      name: Retresco GmbH
      role: Software Entwickler
      from: 2011
      from-month: DEZ
      to: 2018
      to-month: JUL
      summary: >-
        Verantwortlich für die Kernarchitektur und Entwicklung von Echtzeit-Hochleistungssystemen in einem schnelllebigen Beratungs- und Produktumfeld. Bereitstellung robuster Microservices und Datenpipelines für Personalisierung, Automatisierung und skalierbare Deployments.
      highlights:
        - Entwicklung einer Echtzeit-Stream-Processing-Pipeline und eines Personalisierungsalgorithmus für adaptive Content-Bereitstellung (Python, Flask, Kafka, Elasticsearch).
        - Technische Beratung für Unternehmenskunden zu Architekturfragen und Best Practices.
        - Leitung des Refactorings von Legacy-Monolithen hin zu containerisierten Microservices, Einführung von CI/CD-Automatisierung und skalierbarer Infrastruktur (Microservices).
        - Entwurf und Implementierung einer webbasierten GUI für ein Translation Management System mit nahtloser Frontend-Backend-Integration (AngularJS, Tornado, Elasticsearch).
        - Entwicklung eines Systems zur Relationsextraktion für die Analyse von Kurznachrichten zur effizienten Gewinnung von Erkenntnissen aus unstrukturierten Textdaten.

    dfki-job:
      name: DFKI GmbH
      role: Studentischer Mitarbeiter
      from: 2009
      from-month: MAI
      to: 2011
      to-month: APR
      location: BERLIN
      summary: >-
        Beitrag zur Entwicklung eines mehrsprachigen mobilen Dialogassistenten. Entwurf eines Klassifikationsalgorithmus zur Erkennung von Frage-Antwort-Paaren und Verbesserung der Dialogstrukturen im Rahmen einer Diplomarbeit.
      highlights:
        - Entwicklung eines mehrsprachigen mobilen Dialogassistenten (PHP, Objective-C).
        - Entwurf eines Klassifikationsalgorithmus zur Erkennung von Frage-Antwort-Paaren.
        - Verbesserung der Nutzerinteraktion und Dialogstrukturen für das Diplomarbeitsprojekt.

    potsdam-job:
      name: Universität Potsdam
      role: Studentischer Mitarbeiter
      from: 2006
      from-month: MÄR
      to: 2009
      to-month: FEB
      summary: >-
        Konvertierung von Word-Dokumenten nach XML für eXist-db (Python, Tomcat).
      highlights:
        - Entwicklung einer Datenschnittstelle für die Projektwebsite (Python).
        - Erstellung eines CMS für persönliche Mitarbeiter-Websites (Python).

    pfefferwerk:
      name: Pfefferwerk gGmbH
      role: Medienpädagoge
      from: 2003
      from-month: SEP
      to: 2005
      to-month: JUL
      summary: >-
        Durchführung von Vorträgen und Kursen zur Computerinteraktion für Kinder und Auszubildende.


