      summary: >-
        Beitrag zur Entwicklung eines mehrsprachigen mobilen Dialogassistenten. Entwurf eines Klassifikationsalgorithmus zur Erkennung von Frage-Antwort-Paaren und Verbesserung der Dialogstrukturen im Rahmen einer Diplomarbeit.
      highlights:
        - Entwicklung eines mehrsprachigen mobilen Dialogassistenten (PHP, Objective-C).
        - Entwurf eines Klassifikationsalgorithmus zur Erkennung von Frage-Antwort-Paaren.

