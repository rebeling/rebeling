introduction:
  headline: Zusammenfassung
  text: |
    Ich bin ein leidenschaftlicher Softwareentwickler, der tiefes technisches Fachwissen mit einem breiten strategischen Blick verbindet. Mein Hintergrund in der Computerlinguistik ermöglicht es mir, Sprachtechnologien, maschinelles Lernen und KI in Produkte einzubinden, die Nutzer unterstützen und neuen Mehrwert schaffen. Aktuell beschäftige ich mich intensiv mit Multi-Agenten-Systemen und der Frage, wie autonome Agenten kooperieren können, um komplexe Probleme zu lösen.

    Ob ich NLP-Pipelines für große Datenmengen aufbaue oder die Nutzerführung verfeinere, ich behalte stets sowohl das technische Detail als auch das übergeordnete Geschäftsziel im Blick. Ich setze auf kontinuierliche Verbesserung: Ich vertiefe mich in komplexe Themen, teile mein Wissen und iteriere schnell durch agile Praktiken und Automatisierung. Diese Mischung aus Spezialisierung und Generalisten-Mentalität hilft mir, hochwirksame Lösungen in kurzen Zeiträumen zu liefern. Ich gehe jedes Projekt mit Neugier, Empathie und Umsetzungsstärke an, um kluge Technologieentscheidungen mit klaren Geschäftsergebnissen in Einklang zu bringen.

jobs:
  headline: Berufserfahrung
  items:
    uv:
      link: https://www.universum.com/
      name: Universum AG
      role: Senior Softwareentwickler & Architekt
      from: 2023
      from-month: AUG
      to: HEUTE
      summary: >-
        Leitung der Full-Stack-Entwicklung und KI-Integration für unternehmenskritische Projekte, Abstimmung der technischen Implementierung mit strategischen Geschäftszielen. Federführung bei Initiativen in den Bereichen Automatisierung, NLP und sicheres Systemdesign, Beitrag zur Produktinnovation, Nutzerbindung und betrieblichen Effizienz im gesamten Unternehmen.
      highlights:
        - Entwurf und Implementierung eines KI-gestützten Tools zur Integration von Chatbot-Funktionen mit automatisierten E-Mail-Antworten unter Nutzung der Wissensdatenbank des Unternehmens und ChatGPT (Docker, Python, FastAPI, OpenAI, Redis, JavaScript, Vue.js, GitLab CI).
        - Entwicklung von APIs für die Integration des sicheren kryptografischen Online-Wahlsystems Belenios, Unterstützung von 60.000 Nutzern und Bewältigung von ~20 Stimmen/Sekunde (600 pro 30s) (Python, FastAPI).
        - Optimierung der Git-Workflows und CI/CD-Pipelines im Team, was die Bereitstellungszeit erheblich verkürzte und die Effizienz der Zusammenarbeit steigerte (Git, GitLab, Make, Ansible).

    uv-eng:
      link: https://www.universum.com/
      name: Universum AG
      role: Senior Softwareentwickler
      from: 2018
      from-month: OKT
      to: 2023
      to-month: JUL
      summary: >-
        Vorantreiben der Full-Stack-Entwicklung über die Kernprodukte des Unternehmens hinweg, Bereitstellung von Automatisierungs-, NLP- und Content-Funktionen zur Steigerung der Nutzerbindung und betrieblichen Effizienz.
      highlights:
        - Aufbau und Pflege eines skalierbaren Content-Pools zur Aggregation von Nachrichten- und Eventdaten für die nahtlose Integration in mobile Apps (Python, Elasticsearch).
        - Entwicklung eines benutzerdefinierten Drupal-Moduls mit KI-gesteuerter, NLP-erweiterter Suchfunktionalität (PHP, Python, Watson, spaCy, Elasticsearch).

    rtr:
      link: https://www.retresco.com/
      name: Retresco GmbH
      role: Software Entwickler
      from: 2011
      from-month: DEZ
      to: 2018
      to-month: JUL
      summary: >-
        Verantwortlich für die Kernarchitektur und Entwicklung von Echtzeit-Hochleistungssystemen in einem schnelllebigen Beratungs- und Produktumfeld. Bereitstellung robuster Microservices und Datenpipelines für Personalisierung, Automatisierung und skalierbare Deployments.
      highlights:
        - Entwicklung einer Stream-Processing-Pipeline zur adaptiven Content-Personalisierung.
        - Technische Beratung für Unternehmenskunden zu Architekturfragen und Best Practices.
        - Leitung des Refactorings von Legacy-Monolithen zu containerisierten Microservices inklusive CI/CD und skalierbarer Infrastruktur.
        - Relationsextraktion aus Kurznachrichten zur Analyse unstrukturierter Textdaten.

