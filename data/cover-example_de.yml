letter:
  opening: "Sehr geehrte Damen und Herren,"
  body-paragraphs:
    - "hiermit bekunde ich mein großes Interesse an der Position als Senior Softwareentwickler bei Tech Innovations Inc. Mit meinem fundierten Hintergrund in Computerlinguistik und langjähriger Erfahrung im Aufbau skalierbarer Echtzeitsysteme freue ich mich über die Möglichkeit, Ihr Engineering-Team zu verstärken."
    - "In meiner aktuellen Position bei der Universum AG habe ich die Entwicklung KI-gestützter Tools geleitet, die sich effektiv in umfassende Wissensdatenbanken integrieren lassen und sowohl die betriebliche Effizienz als auch die Nutzerbindung verbessern. Meine Erfahrung erstreckt sich über den gesamten Stack – von der Entwicklung robuster Microservices mit Python und FastAPI bis hin zum Design nutzerzentrierter Oberflächen. Ich blühe in Umgebungen auf, die mich fordern, technische Präzision mit strategischem Denken zu verbinden."
    - "Besonders beeindruckt bin ich von dem Engagement der Tech Innovations Inc., die Grenzen des mit modernen Webtechnologien Machbaren immer wieder zu verschieben. Ich bin bestrebt, meine Expertise in den Bereichen NLP, maschinelles Lernen und sicheres Systemdesign einzubringen, um komplexe Probleme zu lösen und hochwertige Software zu liefern."
  closing: "Vielen Dank für die Prüfung meiner Bewerbung. Ich freue mich auf die Gelegenheit, persönlich zu besprechen, wie meine Fähigkeiten und Erfahrungen zu den Anforderungen Ihres Teams passen."
