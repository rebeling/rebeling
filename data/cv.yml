      highlights:
        - Developed a real-time stream processing pipeline and personalisation algorithm for adaptive content delivery (Python, Flask, Kafka, Elasticsearch).
        - Provided technical consultancy to enterprise clients, guiding architecture decisions and best practices across projects.
        - Led refactoring of legacy monoliths into containerised microservices, introducing CI/CD automation and scalable infrastructure (Microservices).
        - Designed and implemented a web-based GUI for a Translation Management System with seamless frontend-backend integration (AngularJS, Tornado, Elasticsearch).
