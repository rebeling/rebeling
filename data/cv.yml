      summary: >-
        Led full-stack development and AI integration for mission-critical projects, aligning deep technical implementation with strategic business goals. Spearheaded initiatives in automation, NLP, and secure systems design, contributing to product innovation, user engagement, and operational efficiency across the organisation.
      highlights:
        - Designed and implemented an AI-powered tool integrating chatbot capabilities with automated email responses, leveraging the company's knowledge base and ChatGPT (Docker, Python, FastAPI, OpenAI, Redis, JavaScript, Vue.js, GitLab CI).
        - Engineered APIs for Belenios secure cryptographic online voting system integration, supporting 60,000 users and sustaining ~20 votes/second (600 per 30s) (Python, FastAPI).
        - Optimised team Git workflows and CI/CD pipelines, significantly reducing deployment time and boosting collaboration efficiency (Git, GitLab, Make, Ansible).

    uv-eng:
